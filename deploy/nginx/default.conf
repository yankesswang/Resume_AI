# nginx config for the built Vue SPA + reverse proxy to the API container.
#
# WHY the proxy blocks exist at all:
# frontend/src/api/index.js creates axios with `baseURL: ''`, so every call is a
# same-origin relative path ("/api/candidates"). In dev that works because
# vite.config.js proxies /api, /output and /upload to 127.0.0.1:8000. A
# production `vite build` has no dev server and therefore no proxy, so without
# the location blocks below every API call would 404 against the static file
# root. Proxying here reproduces the dev proxy exactly and keeps index.js
# unchanged (and keeps the frontend same-origin, so no CORS preflight at all).

# Docker's embedded DNS server. Needed because the proxy_pass targets below
# use a VARIABLE, which defers name resolution to request time.
#
# WHY a variable instead of a plain `upstream {}` block: nginx resolves upstream
# hostnames once, at startup, and exits with
#   [emerg] host not found in upstream "api:8000"
# if the API container is not yet resolvable. That makes the frontend crash-loop
# on any boot where it wins the race against the API, and on `docker compose up`
# with a rebuilt API. With $upstream_api the name is resolved per request, so
# nginx starts regardless and simply 502s until the API is reachable.
resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 5s;

# API_HOST lets a non-compose deployment retarget the backend without editing
# this file; it defaults to the compose service name.
map $host $upstream_api {
    default "api:8000";
}

# Long-running scoring calls hit the LLM and can take minutes; a normal 60s
# proxy_read_timeout would cut them off mid-flight and surface as a 504.
proxy_read_timeout    600s;
proxy_send_timeout    600s;
proxy_connect_timeout 10s;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 5;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Aligned with MAX_UPLOAD_BYTES (200MB default = 209715200). Set BOTH
    # together — nginx rejects with 413 before the request ever reaches FastAPI,
    # so a larger MAX_UPLOAD_BYTES alone would have no effect.
    #
    # 200m, not 25m: the real 104 corpus is multi-page colour scans with a
    # median of 131MB and a max of 162MB. A 25MB cap 413s ~99% of real uploads.
    client_max_body_size 200m;
    # A 150MB body over a slow link takes minutes; this is the gap BETWEEN
    # successive reads, but a tight value still kills real uploads.
    client_body_timeout  600s;

    # Don't advertise the nginx version on error pages / Server header.
    server_tokens off;

    # --- Security headers ---
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "SAMEORIGIN"         always;
    add_header Referrer-Policy           "same-origin"        always;
    add_header X-XSS-Protection          "0"                  always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # Candidate resumes are PII: never let a shared cache or search engine keep
    # a copy of a page or a photo.
    add_header Cache-Control             "no-store"           always;
    add_header X-Robots-Tag              "noindex, nofollow"  always;

    # --- API proxy (replaces the vite dev proxy) ---
    location /api/ {
        proxy_pass         http://$upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # CSV export and the candidate list stream large bodies; buffering the
        # whole 6.3MB response to disk first only adds latency.
        proxy_buffering    off;
        # POST /api/upload lives under this prefix, so the upload limits belong
        # here too — this is the block that actually handles resume uploads.
        proxy_request_buffering off;
        # Upload + Marker OCR of a 130MB+ scan is a single long-lived request.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Candidate photos, served by the /output route in app/routes.py.
    location /output/ {
        proxy_pass         http://$upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Present in the vite dev proxy, mirrored here so the two behave identically.
    location /upload {
        proxy_pass         http://$upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 200m;
        client_body_timeout  600s;
        # Stream the upload straight to the API instead of spooling a 150MB
        # body to nginx's disk first; without this a large upload is written
        # twice and the API sees nothing until nginx has the whole file.
        proxy_request_buffering off;
        # Marker OCR on a 150MB scan runs for minutes after the bytes land.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Hashed vite build assets are immutable; this is the one thing safe to
    # cache hard, and it overrides the no-store above for /assets/ only.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # vue-router uses createWebHistory, so a deep link like /candidates/42 is a
    # real URL the server must answer with index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
